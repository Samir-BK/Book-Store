<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
    <h1>Add book</h1>
    <div>
        <form th:object="${book}" th:action="@{/save}" method="post">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" /><br>

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" /><br>

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" /><br>

            <label for="publicationYear">Year</label>
            <input type="text" id="publicationYear" th:field="*{publicationYear}" /><br>

            <label for="price">Price</label>
            <input type="text" id="price" th:field="*{price}" /><br>

            <input type="submit" value="Save">
        </form>
    </div>
</body>
</html>
